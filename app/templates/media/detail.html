{% extends "base.html" %}
{% block title %}{{ item.caption or item.original_name }} — {{ event.title }}{% endblock %}
{% block content %}
<p class="back-link"><a href="{{ url_for('media.gallery', code=event.code) }}">&larr; {{ _("Galerie") }}</a></p>

<div class="page-head">
    <div>
        <h1>{{ item.caption or item.original_name }}</h1>
    </div>
</div>

<figure class="media-detail">
  {% if item.mime_type.startswith("video/") %}
  <video src="{{ url_for('media.file', code=event.code, item_id=item.id) }}" controls></video>
  {% else %}
  <img src="{{ url_for('media.file', code=event.code, item_id=item.id) }}" alt="{{ item.caption or item.original_name }}">
  {% endif %}
  <figcaption class="meta">
    {% if item.display_date %}{{ _("Pris le") }} {{ item.display_date.strftime("%d/%m/%Y %H:%M") }}{% endif %}
    · {{ item.uploaded_by_name }}
    {% if item.has_location %} · 📍 {{ "%.4f"|format(item.latitude) }}, {{ "%.4f"|format(item.longitude) }}{% endif %}
  </figcaption>
</figure>

{% if ctx.can_delete(item) %}
<form method="post" action="{{ url_for('media.delete', code=event.code, item_id=item.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="btn btn-danger-solid">{{ _("Supprimer") }}</button>
</form>
{% endif %}
{% endblock %}
