{% extends "base.html" %}
{% block content %}
<h1>{{ _("Nouvel événement") }}</h1>

<form method="post" action="{{ url_for('events.create') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="title">{{ _("Titre") }} *</label>
  <input type="text" id="title" name="title" required maxlength="200">

  <label for="description">{{ _("Description") }}</label>
  <textarea id="description" name="description" rows="3" maxlength="2000"></textarea>

  <label for="start_date">{{ _("Date de début") }} *</label>
  <input type="date" id="start_date" name="start_date" required>

  <label for="end_date">{{ _("Date de fin") }} *</label>
  <input type="date" id="end_date" name="end_date" required>

  <label for="location">{{ _("Lieu") }}</label>
  <input type="text" id="location" name="location" maxlength="300">

  <label for="email">{{ _("Votre email") }} *</label>
  <input type="email" id="email" name="email" required>

  <button type="submit">{{ _("Créer") }}</button>
</form>
{% endblock %}
