{% extends "base.html" %}
{% block title %}{{ _("Nouveau foyer") }} — {{ event.title }}{% endblock %}
{% block content %}
<h1>{{ _("Nouveau foyer") }}</h1>

<form method="post" action="{{ url_for('costs.add_household', code=event.code) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="name">{{ _("Nom du foyer") }} *</label>
  <input type="text" id="name" name="name" required minlength="2" maxlength="100"
         placeholder="{{ _('Ex : Famille Dupont') }}">

  <label for="num_adults">{{ _("Nombre d'adultes") }} *</label>
  <input type="number" id="num_adults" name="num_adults" required min="1" max="20" value="1">

  <label for="num_children">{{ _("Nombre d'enfants") }}</label>
  <input type="number" id="num_children" name="num_children" min="0" max="20" value="0">

  <label for="adult_weight">{{ _("Parts par adulte") }}</label>
  <input type="number" id="adult_weight" name="adult_weight" step="0.1" min="0.1" max="10" value="1.0">

  <label for="child_weight">{{ _("Parts par enfant") }}</label>
  <input type="number" id="child_weight" name="child_weight" step="0.1" min="0" max="10" value="0.5">

  <button type="submit">{{ _("Ajouter le foyer") }}</button>
</form>
{% endblock %}
