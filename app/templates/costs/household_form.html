{% extends "base.html" %}
{% block title %}{{ _("Nouveau foyer") }} — {{ event.title }}{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>{{ _("Nouveau groupe") }}</h1>
        <p class="page-sub">{{ event.title }}</p>
    </div>
</div>

<form method="post" action="{{ url_for('costs.add_household', code=event.code) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="name">{{ _("Nom du groupe") }} *</label>
    <input type="text" id="name" name="name" required minlength="2" maxlength="100"
           placeholder="{{ _('Ex : Famille Dupont, Alice + Bob') }}">
  </div>

  <div class="form-grid form-grid-compact">
    <div class="field">
      <label for="num_adults">{{ _("Nombre d'adultes") }} *</label>
      <input type="number" id="num_adults" name="num_adults" required min="1" max="20" value="1">
    </div>
    <div class="field">
      <label for="num_children">{{ _("Nombre d'enfants") }}</label>
      <input type="number" id="num_children" name="num_children" min="0" max="20" value="0">
    </div>
  </div>

  <p class="hint">{{ _("Le ratio adulte/enfant se définit sur la page des frais.") }}</p>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ _("Ajouter le groupe") }}</button>
  </div>
</form>
{% endblock %}
