{% extends "base.html" %}
{% block title %}Login - SaaS{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h1 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Connexion</h1>
        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       x-data="{ value: '' }" x-model="value" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                Se connecter
            </button>
        </form>
    </div>
</div>
{% endblock %}
