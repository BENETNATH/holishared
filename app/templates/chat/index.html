{% extends "base.html" %}
{% block title %}{{ _("Chat") }} — {{ event.title }}{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>{{ _("Chat") }}</h1>
        <p class="page-sub">{{ event.title }}</p>
    </div>
</div>

<div id="messages"
     class="chat-messages"
     role="log"
     aria-live="polite"
     hx-get="{{ url_for('chat.index', code=event.code) }}"
     hx-trigger="load, every 5s"
     hx-swap="innerHTML">
  {% include "chat/_messages.html" %}
</div>

<form method="post" action="{{ url_for('chat.send', code=event.code) }}" class="chat-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="chat-content">{{ _("Votre message") }}</label>
    <textarea id="chat-content" name="content" rows="2" maxlength="2000" required></textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ _("Envoyer") }}</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
  function scrollChat() {
    var box = document.getElementById("messages");
    if (box) { box.scrollTop = box.scrollHeight; }
  }
  // Initial scroll + scroll after every HTMX poll swap (new messages).
  document.addEventListener("DOMContentLoaded", scrollChat);
  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.target && e.target.id === "messages") { scrollChat(); }
  });
</script>
{% endblock %}
