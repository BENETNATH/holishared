# SaaS - Nginx reverse proxy
# Copy to /etc/nginx/sites-available/saas and symlink to sites-enabled

upstream saas_app {
    server 127.0.0.1:8400;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;  # CHANGE: your domain

    # Security headers sent by the app (B015) on every response:
    # Strict-Transport-Security, X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, Content-Security-Policy.
    # Only headers NOT managed by the app are set here.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting (10 req/s per IP)
    limit_req zone=saas_limit burst=20 nodelay;

    # Body size limit (B015: 50M, aligné avec MAX_FILE_SIZE media)
    client_max_body_size 50M;

    # Gzip (B015)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Logs
    access_log /var/log/nginx/saas_access.log;
    error_log /var/log/nginx/saas_error.log;

    # Static files: cache 30 jours (B015)
    location /static/ {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Health check (no auth)
    location /health {
        proxy_pass http://saas_app;
        access_log off;
    }
}

# Rate limit zone (add to nginx.conf http block if not present)
# limit_req_zone $binary_remote_addr zone=saas_limit:10m rate=10r/s;
