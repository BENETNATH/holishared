# SaaS - Nginx reverse proxy
# Copy to /etc/nginx/sites-available/saas and symlink to sites-enabled

upstream saas_app {
    server 127.0.0.1:8400;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;  # CHANGE: your domain

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting (10 req/s per IP)
    limit_req zone=saas_limit burst=20 nodelay;

    # Body size limit
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/saas_access.log;
    error_log /var/log/nginx/saas_error.log;

    location / {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Health check (no auth)
    location /health {
        proxy_pass http://saas_app;
        access_log off;
    }
}

# Rate limit zone (add to nginx.conf http block if not present)
# limit_req_zone $binary_remote_addr zone=saas_limit:10m rate=10r/s;
