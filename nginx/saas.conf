# Holishared - Nginx reverse proxy (Docker)
# Mounted at /etc/nginx/conf.d/default.conf
# This file is included in the http block, so limit_req_zone is valid here.

# Rate limit zone (10 req/s per IP)
limit_req_zone $binary_remote_addr zone=saas_limit:10m rate=10r/s;

upstream saas_app {
    server app:8400;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting
    limit_req zone=saas_limit burst=20 nodelay;

    # Body size limit (50M for media uploads)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Static files: cache 30 jours
    location /static/ {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Health check (no auth, no rate limit)
    location /health {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main app
    location / {
        proxy_pass http://saas_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
