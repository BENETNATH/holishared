name: CI

# Déclenchement manuel uniquement : le dépôt n'a pas de minutes GitHub Actions.
# La porte de qualité est locale (ruff, mypy, pytest, build CSS, npm run ui:check).
# Pour réactiver la CI automatique, remettre push/pull_request sur [main, "ui/**"].
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy bandit flask flask-sqlalchemy flask-login flask-babel flask-limiter flask-wtf
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app/
      - name: Bandit
        run: bandit -r app/ -f txt --exit-zero
      - name: i18n (catalogues synchronisés, tout traduit, .mo à jour)
        run: python scripts/i18n.py check

  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      SUPERADMIN_PASSWORD: ci-test-superadmin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest --tb=short
      - name: Coverage
        run: pytest --cov=app --cov-report=xml
        if: github.ref == 'refs/heads/main'

  frontend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      SUPERADMIN_PASSWORD: ci-test-superadmin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: CSS compilé à jour
        run: npm run build:css && git diff --exit-code -- app/static/css/app.css
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Auto-contrôle de la garde
        run: npm run ui:selftest
        env:
          PYTHON: python
      - name: Garde UI
        run: npm run ui:check
        env:
          PYTHON: python
