name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy bandit flask flask-sqlalchemy flask-login flask-babel flask-limiter flask-wtf
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app/
      - name: Bandit
        run: bandit -r app/ -f txt --exit-zero

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest --tb=short
      - name: Coverage
        run: pytest --cov=app --cov-report=xml
        if: github.ref == 'refs/heads/main'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: CSS compilé à jour
        run: npm run build:css && git diff --exit-code -- app/static/css/app.css
