[project]
name = "holishared"
version = "0.1.0"
description = "SaaS de planification de vacances/événements en groupe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "flask-babel>=4.0",
    "flask-wtf>=1.2",
    "flask-limiter>=3.8",
    "waitress>=3.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".swival"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez (no naive datetimes)
    "PT",     # flake8-pytest-style
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (style, not a bug)
    "S603",   # subprocess with shell=False is fine
    "S105",   # hardcoded password string (we use env vars)
    "S106",   # hardcoded password func arg
    "DTZ003", # datetime.utcnow(): app uses naive UTC consistently (SQLite storage)
    "DTZ005", # datetime.now() in tests is fine
    "DTZ007", # strptime parsing of user input (naive by design, B003)
    "DTZ011", # date.today() for planning display (spec B003 §5.1)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert est l'idiome pytest

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "flask_babel.*",
    "flask_login.*",
    "flask_sqlalchemy.*",
    "flask_wtf.*",
    "flask_limiter.*",
    "qrcode.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
