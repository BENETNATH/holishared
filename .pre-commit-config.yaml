repos:
  - repo: ruff
    rev: "v0.4.4"
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: mypy
    rev: "v1.10.0"
    hooks:
      - id: mypy
        additional_dependencies: ["flask", "flask-sqlalchemy", "flask-login", "flask-babel"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.6.0"
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: debug-statements
